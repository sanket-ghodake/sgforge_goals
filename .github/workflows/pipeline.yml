name: Forge Micro-App CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: "Quality Gate & 5-Tier Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Harden Permissions
        run: |
          chmod +x run.sh env.sh portables/bin/* .githooks/* || true

      - name: Environment Bootstrap
        run: |
          ./run.sh setup

      - name: Run 18-Check Quality Gate
        run: |
          ./run.sh verify

      - name: Run 5-Tier Tests
        run: |
          ./run.sh test
