name: ${CONTAINER_PREFIX:-forge}-app-${APP_NAME:-goals}-prod

networks:
  goals-airgap-net:
    driver: bridge
    internal: true

  forge-gateway-net:
    name: ${FORGE_APPS_NETWORK:-${CONTAINER_PREFIX:-forge}_apps_net}
    external: true

services:
  app-prod:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    container_name: ${CONTAINER_PREFIX:-forge}-app-${APP_NAME:-goals}-prod
    ports:
      - "${PORT:-8090}:${PORT:-8090}"
    environment:
      - PORT=${PORT:-8090}
      - APP_NAME=${APP_NAME:-goals}
      - CONTAINER_PREFIX=${CONTAINER_PREFIX:-forge}
      - NODE_ENV=production
      - FORGE_GATEWAY_URL=${FORGE_GATEWAY_URL:-http://localhost:8080}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://localhost:8080/auth}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set for production}
    volumes:
      - ${DATA_DIR:-../../data}:/app/data
      - ${LOG_DIR:-../../logs}:/app/logs
    networks:
      goals-airgap-net:
      forge-gateway-net:
        aliases:
          - app-${APP_NAME:-goals}
          - ${APP_NAME:-goals}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${PORT:-8090}/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
